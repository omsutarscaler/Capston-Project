spring.application.name=UserAuthService
server.port=8081
account.storefront-url=${STOREFRONT_URL:http://localhost:3000}
account.email-from=${RECEIPT_FROM:accounts@ecommerce.test}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
auth.jwt.secret-base64=${AUTH_JWT_SECRET_BASE64}
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://localhost:3306/user_service
