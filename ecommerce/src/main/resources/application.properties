spring.application.name=ecommerce
spring.datasource.url=jdbc:mysql://localhost:3306/test
spring.datasource.username=root
spring.jpa.hibernate.ddl-auto=update
userservice.base-url=http://localhost:8081
spring.mvc.problemdetails.enabled=true
springdoc.swagger-ui.disable-swagger-default-url=true
payment.gateway-url=http://127.0.0.1:8082
payment.service-key=${PAYMENT_SERVICE_KEY:}
checkout.storefront-url=http://localhost:8080/
checkout.receipt-from=${RECEIPT_FROM:receipts@ecommerce.test}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=3000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
